name: E2E V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://edekhbhal.vercel.app
      E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_PM_EMAIL: ${{ secrets.E2E_PM_EMAIL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_UNASSIGNED_EMAIL: ${{ secrets.E2E_UNASSIGNED_EMAIL }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Demo Workspace focused E2E
        run: npx playwright test e2e/demo-workspace.spec.ts

      - name: Run complete V2 E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-v2
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
